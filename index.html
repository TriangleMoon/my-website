<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veronika Baranova - фрилансер</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

</head>

<body>
    <header class="hero">
        <div class="container">
            <div class="hero-header">
                <img src="img\logo.svg" alt="Glo Academy" class="logo">
                <div class="social-links">
                    <a href="#" class="social-link"><img src="img\social\github.svg" alt="GitHub"></a>
                    <a href="#" class="social-link"><img src="img\social\twitter.svg" alt="X"></a>
                    <a href="#" class="social-link"><img src="img\social\instagram.svg" alt="Instagram"></a>
                    <a href="#" class="social-link"><img src="img\social\facebook.svg" alt="Facebook"></a>
                </div>
            </div>

            <div class="hero-content">
                <div class="hero-text">
                    <span class="hero-subtitle">Фрилансер</span>
                    <h1 class="hero-title">Veronika Baranova</h1>
                    <p class="hero-description">Разрабатываю сайты для малого и среднего бизнеса. У меня можно заказать
